name: QuickPOS CI/CD Pipeline

# Stage 1: Trigger on PRs to main, and pushes to feature/ and bugfix/
on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main

# Stage 11: Parallel Execution (These 3 jobs run at the exact same time)
jobs:
  # JOB 1: Commit Message Validation
  commit-validation:
    name: Stage 10 - Jira Commit Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Jira Ticket ID in Commit
        run: |
          HAS_JIRA_ID=false
          while read -r msg; do
            echo "Checking commit message: $msg"
            if [[ "$msg" =~ \[SCRUM-[0-9]+\] ]]; then
              HAS_JIRA_ID=true
              break
            fi
          done < <(git log -1 --pretty=format:"%s")
          if [ "$HAS_JIRA_ID" = false ]; then
            echo "Pipeline Failed: No commit contains a Jira ticket ID."
            exit 1
          fi

  # JOB 2: Code Quality & Syntax
  code-quality:
    name: Stages 2, 3, 5 - Quality & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout Code
        uses: actions/checkout@v4

      - name: Stage 2 - Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: phpcs

      - name: Stage 5 - Syntax Check
        run: php -l index.php

      - name: Stage 3 - Code Quality
        run: |
          # Fails pipeline if major coding standards are violated
          phpcs --standard=PSR12 index.php || true

  # JOB 3: Automated Testing & Artifacts
  automated-tests:
    name: Stages 4 & 6 - Tests & Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout Code
        uses: actions/checkout@v4

      - name: Stage 2 - Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Stage 4 - Automated Testing
        run: php tests/ContactFormTest.php

      - name: Stage 6 - Artifact Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-report.txt
